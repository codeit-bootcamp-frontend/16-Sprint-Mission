<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style/style.css" />
    <title>로그인</title>
  </head>
  <body>
    <section class="auth-container">
      <h1 class="title">
        <a href="../index.html">
          <img src="../images/logo_sub_page.png" alt="판다마켓로고" />
        </a>
        <span class="sr-only">판다마켓</span>
      </h1>

      <form class="form-wrap" action="/login">
        <label class="label" for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="input"
          autocomplete="email"
          placeholder="이메일을 입력해주세요"
        />
        <span class="warning-text"></span>
        <label class="label" for="pw">비밀번호</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="pw"
            name="pw"
            required
            class="input"
            placeholder="비밀번호를 입력해주세요"
          />
          <span
            class="eye-icon"
            aria-label="비밀번호 표시"
            aria-pressed="false"
          ></span>
        </div>
        <span class="warning-text"></span>
        <button class="form-btn" type="submit" disabled>로그인</button>
      </form>
      <div class="easy-login-wrap">
        <p class="login-info">간편 로그인하기</p>
        <ul class="easy-login">
          <li class="login-btn">
            <a href="https://www.google.com/" rel="noopener noreferrer">
              <img src="../images/google.png" alt="구글 간편 로그인 버튼" />
            </a>
          </li>
          <li class="login-btn">
            <a href="https://www.kakaocorp.com/page/" rel="noopener noreferrer">
              <img src="../images//kakao.png" alt="카카오 간편 로그인 버튼" />
            </a>
          </li>
        </ul>
      </div>
      <div class="signup-wrap">
        <span>판다마켓이 처음이신가요?</span>
        <span><a class="goto-page" href="./signup.html">회원가입</a></span>
      </div>
    </section>
    <script src="../script/login.js" type="module" defer></script>
  </body>
</html>
