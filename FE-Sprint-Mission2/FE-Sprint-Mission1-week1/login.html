<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/login.css" />
  </head>

  <body class="flex-center"> 
    <div class="form__social-login--mobile">
      <div class="header__logo flex-center">
        <a href="/FE-Sprint-Mission2/FE-Sprint-Mission1-week1/index.html" aria-label="홈으로 이동">
          <img src="images/logo/panda-market-logo.png">
        </a>
      </div>
      <form class="form flex-center">
        <div class="form__user-info">
          <label for="form__email">이메일</label>
          <input id="form__email" name = "inpo__email" placeholder="이메일을 입력하세요." type="email">
          <div class="form__password--wrapper">
            <label for="form__password">비밀번호</label>
            <img class="input-icon" src="images/btn_visibility_on_24px.png" alt="숨김 아이콘">
            <input id="form__password" name = "inpo__password" placeholder="비밀번호를 입력하세요." type="password">
          </div>
        </div>
        <a href="/login" aria-label="로그인">
          <button class="button flex-center" type="button">
          로그인
          </button>
        </a>
        <div class="form__social-login">
          간편 로그인하기
          <div class="form__signup-link">
            <a href=“https://www.google.com/” aria-label="카카오톡 아이디로 간편 로그인" rel="noopener noreferrer">
              <img src="images/social/Component 2.png">
            </a>
            <a href=“https://www.kakaocorp.com/page/” aria-label="구글아이디로 간편 로그인" rel="noopener noreferrer">
              <img src="images/social/Component 3.png">
            </a>
          </div>
        </div>
        <div class="form__signup-link">
          판다마켓이 처음이신가요?
          <a href="/FE-Sprint-Mission2/FE-Sprint-Mission1-week1/signup.html" aria-label="회원가입페이지로 이동">
            회원가입
          </a>
        </div>
      </form> 
    </div>
  </body>
</html>
