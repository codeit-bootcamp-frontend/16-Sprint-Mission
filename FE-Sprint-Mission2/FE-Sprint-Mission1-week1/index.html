<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta
      property="og:image"
      content="https://pandamarket9029.netlify.app/images/og.jpg"
    />
    <meta property="og:url" content="https://www.codeit.kr/dashboard" />

    <title>판다마켓</title>
    <link rel="stylesheet" href="/FE-Sprint-Mission1-week1/styles/reset.css" />
    <link rel="stylesheet" href="/FE-Sprint-Mission1-week1/styles/header.css" />
    <link rel="stylesheet" href="/FE-Sprint-Mission1-week1/styles/main.css" />
    <link rel="stylesheet" href="/FE-Sprint-Mission1-week1/styles/footer.css" />
  </head>

  <body>
    <header class="header">
      <div class="headerWrapper">
        <a href="/FE-Sprint-Mission1-week1/index.html" aria-label="홈으로 이동">
          <img
            style="width: 153px; height: 51px"
            class="title"
            src="/FE-Sprint-Mission1-week1/images/logo/panda-market-logo.png"
          />
        </a>

        <a
          href="/FE-Sprint-Mission1-week1/login.html"
          class="goToLogin"
          aria-label="로그인 페이지로 이동"
          >로그인</a
        >
      </div>
    </header>

    <main>
      <section class="mainHighlightBox">
        <div class="sectionWrapper">
          <figure>
            <div class="contentGroup">
              <div class="words">
                <h1>일상의 모든 물건을 거래해 보세요</h1>
              </div>
              <a
                href="/FE-Sprint-Mission1-week1/items.html"
                aria-label="물품 목록으로 이동"
              >
                <button>구경하러가기</button>
              </a>
            </div>
            <img
              src="/FE-Sprint-Mission1-week1/images/home/hero-image.png"
              alt="판다마켓의 마스코트인 판다가 손을 흔들고 있는 이미지입니다."
            />
          </figure>
        </div>
      </section>

      <div class="sectionGroup">
        <section>
          <figure class="container">
            <img
              src="/FE-Sprint-Mission1-week1/images/home/feature1-image.png"
              alt="두 마스코트 판다가 하나의 인기상품을 구경하는 이미지입니다."
            />

            <div class="words">
              <div class="feature">Hot item</div>
              <h1>인기 상품을 확인해 보세요</h1>
              <p>가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</p>
            </div>
          </figure>
        </section>

        <section>
          <figure class="container twist">
            <img
              src="/FE-Sprint-Mission1-week1/images/home/feature2-image.png"
              alt="돋보기가 상품을 확대하는 이미지입니다."
            />
            <div class="words textRight">
              <div class="feature">Search</div>
              <h1>구매를 원하는 상품을 검색해 보세요</h1>
              <p>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</p>
            </div>
          </figure>
        </section>

        <section>
          <figure class="container">
            <img
              src="/FE-Sprint-Mission1-week1/images/home/feature3-image.png"
              alt="다양한 상품들이 각각의 카테고리에 담겨지는 모습의 이미지입니다."
            />
            <div class="words">
              <div class="feature">Register</div>
              <h1>판매를 원하는 상품을 등록하세요</h1>
              <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
            </div>
          </figure>
        </section>
      </div>
      <section class="mainHighlightBox">
        <div class="sectionWrapper">
          <figure>
            <div>
              <h1>믿을 수 있는<br />판다마켓 중고 거래</h1>
            </div>
            <img
              src="/FE-Sprint-Mission1-week1/images/home/bottom-banner-image.png"
              alt="두 마스코트 판다가 즐겁게 거래하는 이미지입니다."
            />
          </figure>
        </div>
      </section>
    </main>

    <footer class="flex-center">
      <div class="footerContainer">
        ©codeit - 2024
        <div class="linkNearing">
          <a
            href="/FE-Sprint-Mission1-week1/privacy.html"
            aria-label="개인정보보호방침(서)로 이동"
            >Privacy Policy</a
          >
          <a href="/FE-Sprint-Mission1-week1/faq.html">FAQ</a>
        </div>
        <div class="icons">
          <a
            href="https://www.facebook.com/?locale=ko_KR"
            rel="noopener noreferrer"
          >
            <img
              src="/FE-Sprint-Mission1-week1/images/social/facebook-logo.svg"
              alt="페이스북 아이콘"
            />
          </a>
          <a href="https://x.com/home?lang=ko" rel="noopener noreferrer">
            <img
              src="/FE-Sprint-Mission1-week1/images/social/twitter-logo.svg"
              alt="트위터 아이콘"
            />
          </a>
          <a href="https://www.youtube.com/" rel="noopener noreferrer">
            <img
              src="/FE-Sprint-Mission1-week1/images/social/youtube-logo.svg"
              alt="유투브 아이콘"
            />
          </a>
          <a href="https://www.instagram.com/" rel="noopener noreferrer">
            <img
              src="/FE-Sprint-Mission1-week1/images/social/instagram-logo.svg"
              alt="인스타 아이콘"
            />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
