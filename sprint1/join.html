<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="sub.css">
</head>
<body>
    <div class="join_box">
        <h1 class="logo">
            <img src="./images/join_logo.png" alt="판다마켓">
        </h1>
        <form action="join">
            <div class="form_box">
                <label for="email">이메일</label>
                <input type="text" name="email" placeholder="codeit@email.com">
            </div>
            <div class="form_box">
                <label for="name">닉네임</label>
                <input type="text" name="name">
            </div>
            <div class="form_box">
                <label for="passward">비밀번호</label>
                <input type="password" name="passward">
            </div>
            
            <div class="form_box">
                <label for="passward">비밀번호 확인</label>
                <input type="password" name="passward" >
            </div>
            <button class="join_btn">회원가입</button>
        </form>
        <div class="login_banner">
            <p>간편 로그인하기</p>
            <a href="https://www.google.com/" class="google_login">
                <img src="./images/google_icon.png" alt="구글 로그인하기">
            </a>
            <a href="https://www.kakaocorp.com/page/" class="kakao_login">
                <img src="./images/kakao_icon.png" alt="카카오 로그인하기">
            </a>
        </div>
        <p class="login_txt">이미 회원이신가요? <a href="login.html">로그인</a></p>
    </div>
</body>
</html>
