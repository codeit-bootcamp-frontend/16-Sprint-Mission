<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <meta name="description" content="판다마켓 - 일상의 모든 물건을 거래하는 중고거래 플랫폼" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래하는 중고거래 플랫폼" />
    <meta property="og:image" content="/images/og-panda.svg" />

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1 class="logo">
          <a href="/">
            <img
              src="images/logo_m.svg"
              srcset="
                images/logo_m.svg    103w,
                images/logo_m.svg    206w,
                images/logo_l_1x.svg 153w,
                images/logo_l_2x.svg 306w
              "
              sizes="(max-width:767px) 103px, 153px"
              alt="로고"
              width="153"
              height="51" />
          </a>
        </h1>
        <a href="/pages/login.html" class="login-btn btn" role="button" aria-label="로그인 페이지로 이동">로그인</a>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-heading">
            <h1>
              일상의 모든 물건을
              <span class="word-nowrap">거래해보세요</span>
            </h1>
            <a href="/items" class="more-btn btn" role="button" aria-label="상품 목록 페이지로 이동">구경하러 가기</a>
          </div>
          <div class="img-box flex-center">
            <img src="images/Img_hero.svg" alt="판다마켓 메인 배너 이미지" width="746" height="340" />
          </div>
        </div>
      </section>
      <section class="features container">
        <div class="feature">
          <div class="img-box flex-center">
            <img src="images/Img_feature_01.svg" alt="인기 상품" width="344" height="259" />
          </div>
          <div class="text-box">
            <span class="badge">Hot item</span>
            <h2>
              인기 상품을
              <span class="word-nowrap">확인해보세요</span>
            </h2>
            <p>
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="feature">
          <div class="img-box flex-center">
            <img src="images/Img_feature_02.svg" alt="상품 검색" width="344" height="259" />
          </div>
          <div class="text-box">
            <span class="badge">search</span>
            <h2>
              구매를 원하는
              <span class="word-nowrap">상품을 검색하세요</span>
            </h2>
            <p>
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
        <div class="feature">
          <div class="img-box flex-center">
            <img src="images/Img_feature_03.svg" alt="판매 상품 등록" width="344" height="259" />
          </div>
          <div class="text-box">
            <span class="badge">Register</span>
            <h2>
              판매를 원하는
              <span class="word-nowrap">상품을 등록하세요</span>
            </h2>
            <p>
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <section class="footer-banner">
        <div class="footer-banner-inner">
          <div class="footer-banner-heading">
            <h2>
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h2>
          </div>
          <div class="img-box flex-center">
            <img
              src="images/Img_footer-banner.svg"
              alt="판다마켓 푸터 배너 이미지"
              width="746"
              height="397"
              loading="lazy" />
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-inner container">
        <p class="copyright">©codeit - 2024</p>
        <ul class="footer-links">
          <li class="footer-link"><a href="/privacy">Privacy Policy</a></li>
          <li class="footer-link"><a href="/faq">FAQ</a></li>
        </ul>
        <ul class="sns-links">
          <li>
            <a
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="페이스북 페이지로 이동">
              <img src="images/ic_facebook.svg" alt="페이스북" width="20" height="20" loading="lazy" />
            </a>
          </li>
          <li>
            <a
              href="https://x.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="트위터 페이지로 이동">
              <img src="images/ic_twitter.svg" alt="트위터" width="20" height="20" loading="lazy" />
            </a>
          </li>
          <li>
            <a
              href="https://www.youtube.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="유튜브 페이지로 이동">
              <img src="images/ic_youtube.svg" alt="유튜브" width="20" height="20" loading="lazy" />
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="인스타그램 페이지로 이동">
              <img src="images/ic_instagram.svg" alt="인스타그램" width="20" height="20" loading="lazy" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
