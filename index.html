<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <meta name="description" content="판다마켓 - 일상의 모든 물건을 거래하는 중고거래 플랫폼" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래하는 중고거래 플랫폼" />
    <meta property="og:image" content="/images/og-panda.svg" />

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-inner wrap">
        <h1 class="logo">
          <a href="/">
            <img src="images/Property-1=lg.svg" alt="로고" width="153" height="51" />
          </a>
        </h1>
        <a href="/login" class="login-btn text-base font-semibold" role="button" aria-label="로그인 페이지로 이동">
          로그인
        </a>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-heading">
            <h1 class="text-40 font-bold">
              일상의 모든 물건을
              <br />
              거래해보세요
            </h1>
            <a href="/items" class="more-btn text-xl font-semibold" role="button" aria-label="상품 목록 페이지로  이동">
              구경하러 가기
            </a>
          </div>
          <div class="img-box">
            <img src="images/Img_hero.svg" alt="판다마켓 메인 배너 이미지" width="746" height="340" />
          </div>
        </div>
      </section>
      <section class="features">
        <div class="feature">
          <div class="feature-inner">
            <div class="img-box">
              <img src="images/Img_feature_01.svg" alt="인기 상품" width="579" height="444" />
            </div>
            <div class="text-box">
              <div class="wrap">
                <span class="badge text-lg font-semibold">Hot item</span>
                <h2 class="text-40 font-bold">
                  인기 상품을
                  <br />
                  확인해보세요
                </h2>
                <p class="text-2xl font-medium">
                  가장 HOT한 중고거래 물품을
                  <br />
                  판다 마켓에서 확인해 보세요
                </p>
              </div>
            </div>
          </div>
        </div>
        <div class="feature">
          <div class="feature-inner">
            <div class="text-box">
              <div class="wrap">
                <span class="badge text-lg font-semibold">search</span>
                <h2 class="text-40 font-bold">
                  구매를 원하는
                  <br />
                  상품을 검색하세요
                </h2>
                <p class="text-2xl font-medium">
                  구매하고 싶은 물품은 검색해서
                  <br />
                  쉽게 찾아보세요
                </p>
              </div>
            </div>
            <div class="img-box">
              <img src="images/Img_feature_02.svg" alt="상품 검색" width="579" height="444" />
            </div>
          </div>
        </div>
        <div class="feature">
          <div class="feature-inner">
            <div class="img-box">
              <img src="images/Img_feature_03.svg" alt="판매 상품 등록" width="579" height="444" />
            </div>
            <div class="text-box">
              <div class="wrap">
                <span class="badge text-2lg font-semibold">Register</span>
                <h2 class="text-40 font-bold">
                  판매를 원하는
                  <br />
                  상품을 등록하세요
                </h2>
                <p class="text-2xl font-medium">
                  어떤 물건이든 판매하고 싶은 상품을
                  <br />
                  쉽게 등록하세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="footer-banner">
        <div class="footer-banner-inner">
          <div class="footer-banner-heading">
            <h2 class="text-40 font-bold">
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h2>
          </div>
          <div class="img-box">
            <img src="images/Img_footer-banner.svg" alt="판다마켓 푸터 배너 이미지" width="746" height="397" />
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-inner">
        <p class="copyright text-base font-regular">©codeit - 2024</p>
        <ul class="footer-links">
          <li class="footer-link"><a href="/privacy" class="text-base font-regular">Privacy Policy</a></li>
          <li class="footer-link"><a href="/faq" class="text-base font-regular">FAQ</a></li>
        </ul>
        <ul class="sns-links">
          <li>
            <a
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="페이스북 페이지로 이동">
              <img src="images/ic_facebook.svg" alt="페이스북" width="20" height="20" />
            </a>
          </li>
          <li>
            <a
              href="https://x.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="트위터 페이지로 이동">
              <img src="images/ic_twitter.svg" alt="트위터" width="20" height="20" />
            </a>
          </li>
          <li>
            <a
              href="https://www.youtube.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="유튜브 페이지로 이동">
              <img src="images/ic_youtube.svg" alt="유튜브" width="20" height="20" />
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="sns-link"
              aria-label="인스타그램 페이지로 이동">
              <img src="images/ic_instagram.svg" alt="인스타그램" width="20" height="20" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
