<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="링크" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="링크" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__content">
        <a href="/">
          <picture>
            <source media="(min-width: 768px)" srcset="img/logo.png" />
            <img
              src="img/logo_text.png"
              alt="판다마켓 로고"
              class="header__content__logo"
            />
          </picture>
        </a>
        <a href="/login.html" class="btn btn-small">로그인</a>
      </div>
    </header>

    <main>
      <!-- 상단 배너 -->
      <section class="banner">
        <div class="banner__content">
          <div class="banner__content__text">
            <span class="banner__content__text__title">
              일상의 모든 물건을<br />
              거래해 보세요
            </span>
            <a href="/items.html" class="btn btn-large">구경하러 가기</a>
          </div>
          <img
            src="img/Img_home_top.png"
            alt="판다마켓 메인배너 이미지"
            class="banner__content__img"
          />
        </div>
      </section>

      <!-- 섹션 1 -->
      <section class="feature">
        <!--1-->
        <div class="feature__content">
          <img
            src="img/Img_home_01.png"
            class="feature__content__img"
            alt="물품을 구경하는 판다 이미지"
          />
          <div class="feature__content__text">
            <span class="feature__content__text__point">Hot item</span>
            <span class="feature__content__text__title"
              >인기 상품을<br />
              확인해 보세요
            </span>
            <span class="feature__content__text__subtitle"
              >가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</span
            >
          </div>
        </div>
        <!--2-->
        <div class="feature__content feature__content__reverse">
          <div class="feature__content__text search-text">
            <span class="feature__content__text__point">Search</span>
            <span class="feature__content__text__title"
              >구매를 원하는<br />
              상품을 검색하세요
            </span>
            <span class="feature__content__text__subtitle"
              >구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</span
            >
          </div>
          <img
            src="img/Img_home_02.png"
            class="feature__content__img"
            alt="상품 검색 이미지"
          />
        </div>
        <!--3-->
        <div class="feature__content">
          <img
            src="img/Img_home_03.png"
            class="feature__content__img"
            alt="상품 등록 이미지"
          />
          <div class="feature__content__text">
            <span class="feature__content__text__point">Register</span>
            <span class="feature__content__text__title"
              >판매를 원하는<br />
              상품을 등록하세요
            </span>
            <span class="feature__content__text__subtitle"
              >어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</span
            >
          </div>
        </div>
      </section>

      <!-- 하단 배너 -->
      <section class="promotion__banner">
        <div class="promotion__banner__content">
          <span class="promotion__banner__content__title"
            >믿을 수 있는<br />판다마켓 중고 거래</span
          >
          <img
            src="img/Img_home_promotion.png"
            alt="판다마켓 하단 프로모션 배너"
            class="promotion__banner__content__img"
          />
        </div>
      </section>
    </main>

    <!-- 푸터 -->
    <footer>
      <div class="footer__content">
        <div class="footer__content__menu">
          <span class="footer__content__copyright">@codeit - 2024</span>
          <div class="footer__content__link">
            <a href="/privacy">Privacy Policy</a>
            <a href="/faq">FAQ</a>
          </div>
        </div>

        <div class="footer__content__sns">
          <a href="https://www.facebook.com" target="_blank"
            ><img
              src="img/ic_facebook.png"
              alt="페이스북 로고"
              rel="noopener noreferrer"
          /></a>
          <a href="https://x.com" target="_blank"
            ><img
              src="img/ic_twitter.png"
              alt="트위터 로고"
              rel="noopener noreferrer"
          /></a>
          <a href="https://www.youtube.com" target="_blank"
            ><img
              src="img/ic_youtube.png"
              alt="유튜브 로고"
              rel="noopener noreferrer"
          /></a>
          <a href="https://www.instagram.com/" target="_blank"
            ><img
              src="img/ic_instagram.png"
              alt="인스타그램 로고"
              rel="noopener noreferrer"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
