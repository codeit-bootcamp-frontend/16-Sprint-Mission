<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="top-header">
          <div class="logo">
            <img class="logo-img" src="./images/logo.png" alt="판다마켓 로고" />
          </div>
          <div class="login">
            <a href="#" class="login-button">로그인</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="section1">
        <div class="section1-div">
          <div class="part1">
            <div class="text">
              <h2>일상의 모든 물건을</h2>
              <h2>거래해보세요</h2>
            </div>
            <div class="section1-button">
              <a href="#" class="look-button">구경하러 가리</a>
            </div>
          </div>
          <div class="part2">
            <div class="part2-img">
              <img
                class="section1-img"
                src="./images/image1.png"
                alt="메인이미지"
              />
            </div>
          </div>
        </div>
      </section>
      <section class="section2">
        <div class="section2-div">
          <div class="part1">
            <div class="sub-image">
              <img
                class="subImage"
                src="./images/image2.png"
                alt="구매를 원하시는 상품을 검색하세요"
              />
            </div>
            <div class="sub-title left">
              <p class="subTitle1">Hot Item</p>
              <p class="subTitle2">
                구매를 원하는<br />상품을 검색하세요 확인해 보세요
              </p>
              <p class="subTitle3">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
          </div>
          <div class="part2">
            <div class="sub-image">
              <img
                class="subImage"
                src="./images/image3.png"
                alt="인기상품 그림"
              />
            </div>
            <div class="sub-title right">
              <p class="subTitle1 right">Search</p>
              <p class="subTitle2 right">
                인기 상품을 <br />
                확인해 보세요
              </p>
              <p class="subTitle3 right">
                가장 Hot한 중고고래물품을<br />판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
          <div class="part3">
            <div class="sub-image">
              <img
                class="subImage"
                src="./images/image4.png"
                alt="구매를 원하시는 상품을 검색하세요"
              />
            </div>
            <div class="sub-title left">
              <p class="subTitle1">Register</p>
              <p class="subTitle2">판매를 원하는<br />상품을 등록하세요</p>
              <p class="subTitle3">
                어떤 물건이든 판매하고 싶은 상품을쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <section class="section1">
        <div class="section1-div">
          <div class="part1">
            <div class="text">
              <h2>믿을 수 있는</h2>
              <h2>판다마켓 중고 거래</h2>
            </div>
          </div>
          <div class="part2">
            <div class="part2-img">
              <img
                class="section1-img"
                src="./images/image5.png"
                alt="메인이미지"
              />
            </div>
          </div>
        </div>
      </section>
      <section class="section2">
        <div class="licence">
          <p>©codeit - 2024</p>
        </div>
        <div class="btn">
          <a href="#" class="privacy">Privacy Policy</a>
          <a href="#" class="FAQ">FAQ</a>
        </div>
        <div class="social-icon">
          <img src="./images/icon_facebook.png" alt="facebook link" />
          <img src="./images/icon_twiter.png" alt="twiter link" />
          <img src="./images/icon_youtube.png" alt="youtube link" />
          <img src="./images/icon_instagram.png" alt="instagram link" />
        </div>
      </section>
    </footer>
  </body>
</html>
