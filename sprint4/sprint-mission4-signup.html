<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="commod-form.css" />
    <link rel="stylesheet" href="sprint-mission4-signup.css" />
  </head>
  <body>
    <div class="login-container">
      <a href="/" class="logo">
        <img src="img/logo.png" alt="판다마켓 로고" />
      </a>

      <form action="/signup" method="POST" class="signup-form">
        <div class="form-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="codeit@email.com"
            required
          />

          <span id="emailEmptyError" class="error-message"
          >이메일을 입력해 주세요</span
        >
        <span id="emailInvalidError" class="error-message"
          >잘못된 이메일 형식입니다</span
        >
        </div>

        <div class="form-group">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="판다"
            required
          />
          <span id="nicknameEmptyError" class="error-message">
            닉네임을 입력해주세요.
          </span>
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required />
            <img
              src="img/btn_visibility_on_24px.png"
              alt="비밀번호 보기"
              id="togglePassword"
              class="eye-icon"
            />
          </div>
          <span id="passwordEmptyError" class="error-message"
          >비밀번호를 입력해 주세요</span
        >
        <span id="passwordInvalidError" class="error-message"
          >비밀번호를 8자 이상 입력해 주세요</span
        >
        </div>

        <div class="form-group">
          <label for="password-check">비밀번호 확인</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password-check"
              name="passwordCheck"
              required
            />
            <img
            src="img/btn_visibility_on_24px.png"
            alt="비밀번호 보기"
            id="togglePasswordCheck"
            class="eye-icon"
          />
          </div>
          
          <span id="passwordCheckError" class="error-message"
          >비밀번호가 일치하지 않습니다.</span
        >
        </div>

        <button type="submit" class="signup-btn">회원가입</button>
      </form>

      <div class="divider-box">
        <div class="divider">간편 로그인하기</div>
        <div class="social-login">
          <a
            class="flex-center"
            href="https://www.google.com/"
            aria-label="구글 홈 이동"
            rel="noopener noreferrer"
          >
            <img src="img/Component 2.png" alt="구글 로그인" />
          </a>
          <a
            class="flex-center"
            href="https://www.kakaocorp.com/page/"
            aria-label="카카오 홈 이동"
            rel="noopener noreferrer"
          >
            <img src="img/Component 3.png" alt="카카오 로그인" />
          </a>
        </div>
      </div>

      <p class="login-link">
        이미 회원이신가요?
        <a href="/login" aria-label="로그인으로 이동" rel="noopener noreferrer">
          로그인
        </a>
      </p>
    </div>
    <script src="sprint-mission4-signup.js"></script>
  </body>
</html>
