<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div
      class="login-container"
      aria-label="새로고침"
      rel="noopener noreferrer"
    >
      <a href="/" class="logo"
        ><img src="img/logo.png" alt="판다마켓 로고"
      /></a>

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="codeit@email.com" />
      </div>

      <div class="form-group">
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" placeholder="판다" />
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrapper">
          <input type="password" id="password" />
          <img
            src="img/btn_visibility_on_24px.png"
            alt="비밀번호 보기"
            id="togglePassword"
            class="eye-icon"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password-check">비밀번호 확인</label>
        <div class="input-wrapper">
          <input type="text" id="password-check" />
          <img
            src="img/btn_visibility_on_24px (1).png"
            alt="비밀번호 보기"
            id="togglePassword"
            class="eye-icon"
          />
        </div>
      </div>

      <button class="signup-btn">회원가입</button>

      <div class="divider-box">
        <div class="divider">간편 로그인하기</div>
        <div class="social-login">
          <a
            href="https://www.google.com/"
            aria-label="구글 홈 이동"
            rel="noopener noreferrer"
            ><img src="img/Component 2.png" alt="구글 로그인"
          /></a>
          <a
            href="https://www.kakaocorp.com/page/"
            aria-label="카카오 홈 이동"
            rel="noopener noreferrer"
            ><img src="img/Component 3.png" alt="카카오 로그인"
          /></a>
        </div>
      </div>

      <p class="login-link">
        이미 회원이신가요?
        <a href="/login" aria-label="로그인으로 이동" rel="noopener noreferrer"
          >로그인</a
        >
      </p>
    </div>
  </body>
</html>
