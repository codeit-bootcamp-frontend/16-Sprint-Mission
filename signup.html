<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>
            PandaMarket_signup
        </title>
        <meta charset = "utf-8">
        <link rel = "stylesheet" href = "style.css">
    </head>
    <header class = "login_signup_logo">
        <img src = "pandamarket_images/Property 1=sm@2x.png" alt  = "판다마켓 로고">
    </header>
    <!-- body -->
    <body>
        <div class = "login_signup_container">
            <label for = "email">
                이메일
            </label><br>
            <input type = "email" id = "email" name = "email" required/><br>
            <label for = "nickname">
                닉네임
            </label><br>
            <input type = "text" id = "nickname" name = "nickname" required/><br>
            <label for = "password">
                비밀번호
            </label><br>
            <input type = "password" id = "password" name="password" required/><br>
            <label for = "confirm-password">
                비밀번호 확인
            </label><br>
            <input type = "password" id = "confirm-password" name = "confirm-password" required/><br>
            <button type = "submit" class = "signup_button">
                회원가입
            </button>
                <div class = "easy_login_container">
                    <div class = "easy_login_form">
                        <p>
                            간편 로그인하기
                        </p>
                        <a href = "https://www.google.com/" aria-label = "구글로 간편 로그인">
                            <img src = "pandamarket_images/Component 2.png" alt = "구글">
                        </a>
                        <a href = "https://www.kakaocorp.com/page/" aria-label="카카오톡으로 간편 로그인">
                            <img src = "pandamarket_images/Component 3.png" alt = "카카오톡">
                        </a>
                    </div>
                </div>
                <div>
                    이미 회원이신가요?
                    <a href = "/login.html" aria-label = "로그인 화면으로 이동">
                        <button type = "submit" class = "login_button">
                            로그인하기
                        </button>
                </div>



        </div>    
    </body>
</html>
