<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/login.css" />
    <link rel="stylesheet" href="./style/global.css" />
    <title>판다마켓</title>
  </head>

  <body>
    <script src="./script/signup.js" type="module"></script>
    <script src="./script/function.js" type="module"></script>
    <div id="wrapper">
      <header>
        <a href="index.html">
          <img src="image/logo_big.png" width="396px" alt="판다마켓 로고" />
        </a>
      </header>
      <main>
        <section>
          <form action="login.html">
            <label for="email">
              <span>이메일</span>
              <input
                type="email"
                name="email"
                id="email-input"
                placeholder="codeit@email.com"
                autocomplete="on"
              />
            </label>
            <span class="warning-message">이메일을 입력해주세요.</span>
            <span class="warning-message">잘못된 이메일 형식입니다.</span>
            <label for="nickname">
              <span>닉네임</span>
              <input
                type="text"
                name="nickname"
                id="nickname-input"
                placeholder="판다"
                autocomplete="on"
              />
            </label>
            <span class="warning-message">닉네임을 입력해주세요.</span>
            <label for="password">
              <span>비밀번호</span>
              <div class="password-container">
                <input
                  type="password"
                  name="password"
                  class="password-input"
                  id="password-input"
                  placeholder="비밀번호"
                />
                <button
                  type="button"
                  class="password-show-hide-button"
                  id="pw-visible"
                  aria-label="비밀번호 표시/숨기기"
                >
                  <img
                    id="password-hide-button"
                    src="image/btn_visibility_off_24px.png"
                    alt="비밀번호 가리기"
                  />
                  <img
                    id="password-show-button"
                    class="password-show-button"
                    src="image/btn_visibility_on_24px.png"
                    alt="비밀번호 보이기"
                  />
                </button>
              </div>
            </label>
            <span class="warning-message">비밀번호를 입력해주세요.</span>
            <span class="warning-message"
              >비밀번호를 8자 이상 입력해주세요.</span
            >
            <label for="password-confirm">
              <span>비밀번호 확인</span>
              <div class="password-container">
                <input
                  type="password"
                  name="password-confirm"
                  class="password-confirm-input"
                  id="password-confirm-input"
                  placeholder="비밀번호"
                />
                <button
                  type="button"
                  class="password-show-hide-button"
                  id="pw-visible"
                  aria-label="비밀번호 표시/숨기기"
                >
                  <img
                    id="password-hide-button"
                    src="image/btn_visibility_off_24px.png"
                    alt="비밀번호 가리기"
                  />
                  <img
                    id="password-show-button"
                    class="password-show-button"
                    src="image/btn_visibility_on_24px.png"
                    alt="비밀번호 보이기"
                  />
                </button>
              </div>
            </label>
            <span class="warning-message">비밀번호가 일치하지 않습니다.</span>
            <button
              type="submit"
              class="login-button"
              id="login-button"
              disabled
            >
              회원가입
            </button>
          </form>
        </section>
        <section class="easy-login-container">
          <span>간편 로그인하기</span>
          <div class="easy-login-icon">
            <a
              href="https://www.google.com/"
              target="_blank"
              rel="noopener noreferrer"
              ><img src="image/Component 2.png" alt="간편로그인 구글"
            /></a>
            <a
              href="https://www.kakaocorp.com/page/"
              target="_blank"
              rel="noopener noreferrer"
              ><img src="image/Component 3.png" alt="간편로그인 카카오"
            /></a>
          </div>
        </section>
      </main>
      <footer>
        <span>이미 회원이신가요?</span>
        <a href="login.html">로그인</a>
      </footer>
    </div>
  </body>
</html>
