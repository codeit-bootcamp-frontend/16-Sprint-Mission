<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>판다마켓 회원가입</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="login_signup.css" />
  </head>
  <header class="signup_logo">
    <a href="/" aria-label="홈으로 이동">
      <img src="pandamarket_images/Property 1=sm@2x.png" alt="판다마켓 로고" />
    </a>
  </header>
  <!-- body -->
  <body>
    <div class="login_signup_container">
      <label for="email"> 이메일 </label>
      <input
        type="email"
        placeholder="이메일"
        id="email"
        name="email"
        required
      />
      <label for="nickname"> 닉네임 </label>
      <input
        type="text"
        placeholder="닉네임"
        id="nickname"
        name="nickname"
        required
      />
      <label for="password"> 비밀번호 </label>
      <form class="password_box">
        <input
          type="password"
          placeholder="비밀번호"
          id="password"
          name="password"
          required
        />
        <img
          src="pandamarket_images/closed_eye.png"
          alt="비밀번호 숨기기 아이콘"
          class="eye_icon"
        />
      </form>
      <label for="confirm-password"> 비밀번호 확인 </label>
      <div class="password_box">
        <input
          type="password"
          placeholder="비밀번호 확인"
          id="confirm-password"
          name="confirm-password"
          required
        />
        <img
          src="pandamarket_images/opened_eye.png"
          alt="비밀번호 보이기 아이콘"
          class="eye_icon"
        />
      </div>
      <button type="submit" class="login_signup_button">회원가입</button>
      <div class="easy_login_container">
        <div class="easy_login_form">
          <p>간편 로그인하기</p>
          <div>
            <a
              href="https://www.google.com/"
              aria-label="구글로 간편 로그인"
              class="easy_login_link_icon"
            >
              <img src="pandamarket_images/Component 2.png" alt="구글" />
            </a>
            <a
              href="https://www.kakaocorp.com/page/"
              aria-label="카카오톡으로 간편 로그인"
              class="easy_login_link_icon"
            >
              <img src="pandamarket_images/Component 3.png" alt="카카오톡" />
            </a>
          </div>
        </div>
      </div>
      <div class="direction_text_box">
        이미 회원이신가요?
        <a href="/login.html" aria-label="로그인 화면으로 이동">로그인</a>
      </div>
    </div>
  </body>
</html>
