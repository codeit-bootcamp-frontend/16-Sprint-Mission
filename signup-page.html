<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 회원가입</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/common.css" />
    <link rel="stylesheet" href="style/login-signup-page.css" />
    <meta property="og:title" content="판다 마켓">
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요">
    <meta property="og:image" content="https://example.com/판다마켓공유.webp">
    <meta property="og:url" content="https://example.com">
    <meta property="og:type" content="website">
  </head>
  <body class="login-signup-page">
    <header class="login-signup-page-logo">
      <a class="homepage" href="/">
        <img class="logo" src="image/logo_lg.png" alt="판다마켓로고" />
      </a>
    </header>
    <main class="login-signup">
      <form class="login-signup-form">
        <div class="user-info">
          <label for="login-email">이메일</label>
          <input
            type="text"
            id="login-email"
            name="email"
            autocomplete="email"
            placeholder="이메일을 입력해주세요"
            required
          />
          <div class="error-message"></div>
        </div>
        <div class="user-info">
          <label for="nickname">닉네임</label>
          <input 
            type="text" 
            id="nickname" 
            name="nicknamed"
            placeholder="닉네임을 입력해주세요"
            required 
          />
          <div class="error-message"></div>
        </div>
        <div class="user-info">
          <label for="password">비밀번호</label>
          <input 
            type="password" 
            id="password" 
            name="password"
            placeholder="비밀번호를 입력해주세요"
            required 
          />
          <div class="error-message"></div>
        </div>
        <div class="user-info">
          <label for="password-check">비밀번호 확인</label>
          <input
            type="password"
            id="password-check"
            name="password-check"
            placeholder="비밀번호를 재입력해주세요"
            required
          />
          <div class="error-message"></div>
        </div>
        <button type="button" id="signup-btn" class="login-signup-button flex-center" disabled>
          <span>회원가입</span>
        </button>
        <div class="sns-login">
          <p>간편 로그인하기</p>
          <div class="sns-logo">
            <a href="https://www.google.com/" rel="noopener noreferrer">
              <img src="image/googleBg.png" alt="간편로그인_구글" />
            </a>
            <a href="https://www.kakaocorp.com/page/" rel="noopener noreferrer">
              <img src="image/kakao.png" alt="간편로그인_카카오" />
            </a>
          </div>
        </div>
        <footer class="passing-page">
          판다마켓이 처음이신가요?
          <a href="/signup">회원가입</a>
        </footer>
      </form>
    </main>
    <script src="js/signup.js"></script>
  </body>
</html>
