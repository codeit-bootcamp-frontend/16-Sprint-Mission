<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="commod-form.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <a href="/" class="logo" aria-label="새로고침" rel="noopener noreferrer">
        <img src="img/logo.png" alt="판다마켓 로고" />
      </a>

      <form action="/login" method="POST" class="login-form">
        <div class="form-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="codeit@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required />
            <img
              src="img/btn_visibility_on_24px.png"
              alt="비밀번호 보기"
              id="togglePassword"
              class="eye-icon"
            />
          </div>
        </div>

        <button type="submit" class="login-btn">로그인</button>
      </form>

      <div class="divider-box">
        <div class="divider">간편 로그인하기</div>
        <div class="social-login">
          <a
            class="flex-center"
            href="https://www.google.com/"
            aria-label="구글 홈으로 이동"
            rel="noopener noreferrer"
            ><img src="img/Component 2.png" alt="구글 로그인"
          /></a>
          <a
            class="flex-center"
            href="https://www.kakaocorp.com/page/"
            aria-label="카카오 홈으로 이동"
            rel="noopener noreferrer"
            ><img src="img/Component 3.png" alt="카카오 로그인"
          /></a>
        </div>
      </div>

      <p class="signup-link">
        판다마켓이 처음이신가요?
        <a
          href="/signup"
          aria-label="회원가입으로 이동"
          rel="noopener noreferrer"
          >회원가입</a
        >
      </p>
    </div>
  </body>
</html>
