<!DOCTYPE html>
<html lang="en">
<head>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
</head>
<body>
  <div class="signup-page">
    <div class="signup-logo">
      <a href="../index.html" aria-label="홈으로 이동">
        <img src="../image/property 1=lg.svg" alt="회원가입 페이지 판다마켓 로고">
      </a>
    </div>
    <form class="signup-form">
      <label for="username">이메일</label>
      <input id="username" name="email" type="email" placeholder="codeit@email.com">
      <label for="nickname">닉네임</label>
      <input id="nickname" name="nickname" type="text" placeholder="판다">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password">
      <label for="password-check">비밀번호 확인</label>
      <input id="password-check" name="password-check" type="password">
      <button id="signup-form_btn">회원가입</button>
    </form>
    <div class="signup-footer">
      <div>간편 로그인하기</div>
      <div class="logo-img">
        <a class="google" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
          <img src="../image/googlelogo.svg" alt="구글 로그인 이동">
        </a>
        <a class="kakao" href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer">
          <img src="../image/kakaologo.svg" alt="카카오톡 로그인 이동">
        </a>
      </div>
    </div>
    <div class="signup-login">
      <span>이미 회원이신가요?</span>
      <a href="login.html">로그인</a>
    </div>
  </div>
</body>
</html>
