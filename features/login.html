<!DOCTYPE html>
<html lang="en">
<head>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
</head>
<body>
  <div class="login-page">
    <div class="login-logo">
      <a href="../index.html" aria-label="홈으로 이동">
        <img src="../image/property 1=lg.svg" alt="로그인페이지 판다마켓 로고">
      </a>
    </div>
    <form class="login-form">
      <label for="username">이메일</label>
      <input id="username" name="email" type="email" placeholder="codeit@email.com">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password">
      <button id="login-form_btn">로그인</button>
    </form>
    <div class="login-footer">
      <div>간편 로그인하기</div>
      <div class="logo-img">
        <a class="google" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
          <img src="../image/googlelogo.svg" alt="구글 로그인 이동">
        </a>
        <a class="kakao" href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer">
          <img src="../image/kakaologo.svg" alt="카카오톡 로그인 이동">
        </a>
      </div>
    </div>
    <div class="login-signup">
      <span>판다마켓이 처음이신가요?</span>
      <a href="signup.html">회원가입</a>
    </div>

  </div>

<script src="../script.js"></script>
</body>
</html>
